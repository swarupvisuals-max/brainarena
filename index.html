svg.i{width:23px;height:23px;stroke:currentColor;fill:currentColor;fill-opacity:.14;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}

.mod{position:fixed;inset:0;background:#000A;display:flex;align-items:center;justify-content:center;z-index:9;padding:18px}
.mod>div{background:var(--bg);border:1px solid var(--ln);border-radius:24px;padding:20px;max-width:400px;width:100%;max-height:88vh;overflow:auto;animation:pop .35s cubic-bezier(.2,1.4,.4,1);text-align:center;color:var(--tx)}

.ic{background:none;border:0;color:var(--tx);cursor:pointer;padding:6px}

.tm{height:8px;border-radius:8px;background:var(--ln);overflow:hidden}.tm i{display:block;height:100%;background:#1FBF75;width:100%}
.live{width:9px;height:9px;border-radius:50%;background:#E5484D;animation:pl 1.2s infinite;display:inline-block}@keyframes pl{50%{opacity:.2}}
.sp1{width:34px;height:34px;border:4px solid var(--ln);border-top-color:var(--ac);border-radius:50%;animation:rot .8s linear infinite;margin:20px auto}@keyframes rot{to{transform:rotate(360deg)}}
.bd{animation:fl 3s ease-in-out infinite}@keyframes fl{50%{transform:translateY(-3px) rotate(3deg)}}

.pd{font-size:.72em}.lb{display:flex;align-items:center;gap:10px;padding:10px 12px;margin:7px 0;border-radius:18px;background:var(--card);border:1px solid var(--ln)}
.lb.me{border-color:var(--ac);box-shadow:0 0 0 2px var(--ac) inset}.lb.t1{background:linear-gradient(135deg,#FFE27A55,var(--card))}.lb.t2{background:linear-gradient(135deg,#D5DCE855,var(--card))}.lb.t3{background:linear-gradient(135deg,#E8A87C55,var(--card))}
.pos{width:30px;text-align:center;font-weight:800}

[data-t=PEARL][data-v],[data-v=GK],[data-v=RIDDLE],[data-v=DETECT],[data-v=MATH],[data-v=SAFE],[data-v=WORLD]{--g1:color-mix(in srgb,var(--ac) 36%,transparent);--g2:color-mix(in srgb,var(--ac2) 30%,transparent);--g3:color-mix(in srgb,var(--ac) 16%,transparent);--gl:color-mix(in srgb,var(--ac) 9%,transparent)}

.lb{animation:up .5s both;cursor:pointer}

html[data-v=DETECT] .tb{background:repeating-linear-gradient(45deg,#FFD400 0 14px,#15161C 14px 28px);color:#fff;text-shadow:0 0 4px #000,0 0 2px #000}
html[data-v=DETECT] .card{border-left:4px solid #E5484D}html[data-v=MATH] .card{border:2px dashed #ffffff55}html[data-v=RIDDLE] .card{border:2px solid #E5CE9E;box-shadow:0 6px 0 #E5CE9E}
html[data-v=SAFE] .tb{box-shadow:0 0 22px #19C3A6AA}html[data-v=WORLD] .tb{background:linear-gradient(135deg,#2F6BFF,#27C46B)}
.cal{display:inline-block;width:30px;border-radius:6px;overflow:hidden;border:1.5px solid var(--ac);vertical-align:middle;line-height:1;background:var(--card)}.cal i{display:block;background:var(--ac);color:#fff;font:700 8px/12px var(--ff);font-style:normal}.cal b{display:block;font-size:14px;padding:2px 0}
/* topic icon tiles */
.ti{display:grid;place-items:center;width:42px;height:42px;border-radius:14px;color:#fff;font-style:normal;flex:none;background:linear-gradient(135deg,var(--c1),var(--c2));box-shadow:0 6px 14px color-mix(in srgb,var(--c1) 38%,transparent),inset 0 1px 0 #ffffff55;transition:transform .15s}
.ci{width:24px;height:24px;fill:currentColor;fill-opacity:.2;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.cat:active .ti{transform:scale(.9)}
.tb .ti{width:38px;height:38px;background:#ffffff2e;box-shadow:inset 0 0 0 1px #ffffff55}
.hx svg,.load-brain svg{width:1em;height:1em;fill:currentColor;fill-opacity:.12;stroke:currentColor;stroke-width:1.5;stroke-linecap:round;stroke-linejoin:round}
.hx{color:var(--ac)}
.ld .load-brain{font-size:3rem;line-height:1;display:grid}
svg.i.o{fill:none}
.btn svg.i{width:19px;height:19px;vertical-align:-4px;margin-inline-end:6px}
.md{display:inline-grid;place-items:center;width:28px;height:28px;border-radius:50%;font-weight:800;font-size:.85em;color:#fff;box-shadow:inset 0 1px 0 #fff6,0 2px 6px #0003}
.md.m1{background:linear-gradient(135deg,#FFD24A,#D98E00)}.md.m2{background:linear-gradient(135deg,#E3E8F0,#8F9BB0)}.md.m3{background:linear-gradient(135deg,#EDB087,#B0602A)}
/* settings button + page */
.ic svg{transition:transform .4s}
.ic.gear{width:42px;height:42px;border-radius:14px;display:grid;place-items:center;background:var(--card);border:1px solid var(--ln);box-shadow:0 4px 12px #3A4A8A14;padding:0}
.ic.gear svg{width:23px;height:23px}
.ic.gear:active svg{transform:rotate(90deg)}
.ic:focus-visible,.chip:focus-visible,.sw:focus-visible,.btn:focus-visible,.cat:focus-visible{outline:2px solid var(--ac);outline-offset:2px}
.sec{font-weight:800;font-size:.8em;color:var(--mu);margin:0 0 4px}
.card>.sr,.card>.sg{padding:10px 0}
.card>.sg+.sg,.card>.sg+.sr,.card>.sr+.sg,.card>.sr+.sr{border-top:1px solid var(--ln)}
.sr{display:flex;align-items:center;gap:12px}
.sg .sr{padding:0 0 6px}
.sx{flex:1;min-width:0}.sx .mu{margin-top:1px}
.si{width:34px;height:34px;border-radius:11px;display:grid;place-items:center;flex:none;color:var(--ac);background:color-mix(in srgb,var(--ac) 14%,transparent)}
.si svg{width:19px;height:19px}
.chips{margin:0 -3px}
.sw{position:relative;width:48px;height:28px;border-radius:99px;border:0;background:var(--ln);cursor:pointer;flex:none;transition:background .2s;padding:0}
.sw::after{content:'';position:absolute;top:3px;left:3px;width:22px;height:22px;border-radius:50%;background:#fff;box-shadow:0 2px 5px #0003;transition:transform .2s}
.sw.on{background:linear-gradient(135deg,var(--ac),var(--ac2))}.sw.on::after{transform:translateX(20px)}
.rg{width:100%;margin:8px 0 0;accent-color:var(--ac)}
.btn.dng{background:linear-gradient(135deg,#E5484D,#FF7A45);box-shadow:0 8px 18px #E5484D40}
details.adv summary{cursor:pointer;font-weight:700;list-style:none;display:flex;align-items:center;gap:10px}
details.adv summary::-webkit-details-marker{display:none}
details.adv[open] summary{margin-bottom:10px}
html[data-rm] :not(#splash,#splash *,.ld,.ld *),html[data-rm] :not(#splash,#splash *,.ld,.ld *)::before,html[data-rm] :not(#splash,#splash *,.ld,.ld *)::after{animation:none!important;transition:none!important}
#app.nr>*{animation:none!important}

/* ===== themed animated backgrounds ===== */
#bg{position:fixed;inset:0;z-index:-1;pointer-events:none;overflow:hidden}
#bg.in{animation:bgin 1s ease both}@keyframes bgin{from{opacity:0}}
html[data-tq] #bg{display:none}
#bg i{position:absolute;display:block;font-style:normal}
#bg .ob{width:70vmax;height:70vmax;border-radius:50%;background:radial-gradient(circle,var(--o),transparent 66%);animation:ofl 24s ease-in-out infinite alternate;will-change:transform}
#bg .ob.b{animation-duration:30s;animation-delay:-9s}#bg .ob.c{animation-duration:36s;animation-delay:-15s}
@keyframes ofl{to{transform:translate3d(9vw,7vh,0) scale(1.14)}}
#bg .swp{inset:-40% -60%;background:linear-gradient(112deg,transparent 46%,#ffffff66 50%,transparent 54%);animation:swp 12s ease-in-out infinite}
@keyframes swp{0%{transform:translateX(-35%)}100%{transform:translateX(35%)}}
#bg .au{left:-25%;width:150%;height:36vh;background:linear-gradient(90deg,transparent,var(--a),var(--b),transparent);filter:blur(34px);opacity:.55;transform:skewY(-7deg);animation:aur 18s ease-in-out infinite alternate;will-change:transform}
@keyframes aur{0%{transform:skewY(-7deg) translateX(-6%)}100%{transform:skewY(5deg) translateX(6%) translateY(4vh)}}
#bg .st{border-radius:50%;background:#fff;opacity:.2;box-shadow:0 0 6px #fff9;animation:tw 4s ease-in-out infinite}
@keyframes tw{50%{opacity:.95;transform:scale(1.4)}}
#bg .sht{width:130px;height:1.5px;background:linear-gradient(90deg,transparent,#fff);opacity:0;animation:shoot 9s linear infinite}
@keyframes shoot{0%{opacity:0;transform:translate(0,0) rotate(25deg)}2%{opacity:1}12%{opacity:0;transform:translate(60vw,28vw) rotate(25deg)}100%{opacity:0}}
#bg .pt{top:-6vh;width:calc(10px*var(--s));height:calc(14px*var(--s));border-radius:70% 0 70% 0;background:linear-gradient(135deg,#FFC9DA,#FF8FB1);opacity:.8;animation:fall linear infinite}
@keyframes fall{0%{transform:translate3d(0,-8vh,0) rotate(0)}50%{transform:translate3d(calc(var(--dx)*.4 + 5vw),55vh,0) rotate(260deg)}100%{transform:translate3d(var(--dx),112vh,0) rotate(540deg)}}
#bg .em{bottom:-10px;border-radius:50%;background:radial-gradient(circle,#FFE2B0,#FF7A3D 55%,transparent 72%);box-shadow:0 0 10px #FF7A3D;opacity:0;animation:rise linear infinite}
@keyframes rise{0%{transform:translate3d(0,0,0) scale(1);opacity:0}12%{opacity:.95}100%{transform:translate3d(var(--dx),-105vh,0) scale(.3);opacity:0}}
#bg .gw{left:-20%;right:-20%;bottom:-30%;height:60%;background:radial-gradient(ellipse at 50% 100%,#FF6A2B66,transparent 68%);animation:brth 6s ease-in-out infinite alternate}
@keyframes brth{to{opacity:.55;transform:scale(1.08)}}
#bg .bb{bottom:-20px;border-radius:50%;border:1px solid #BFF3FF88;background:radial-gradient(circle at 30% 30%,#ffffff55,transparent 60%);opacity:0;animation:rise linear infinite}
#bg .wv{left:0;bottom:0;width:200%;animation:wave linear infinite}
@keyframes wave{to{transform:translateX(-50%)}}
/* ===== sharpness / crisp finish ===== */
svg{shape-rendering:geometricPrecision}
.card{box-shadow:0 10px 30px #3A4A8A18,inset 0 1px 0 #ffffffcc,0 0 0 .5px color-mix(in srgb,var(--ac) 16%,transparent)}
html[data-dk] .card{box-shadow:0 12px 32px #00000055,inset 0 1px 0 #ffffff1a,0 0 0 .5px color-mix(in srgb,var(--ac) 26%,transparent)}
nav div{box-shadow:0 12px 34px #2A3A7A30,inset 0 1px 0 #ffffffaa}html[data-dk] nav div{box-shadow:0 14px 34px #0009,inset 0 1px 0 #ffffff1a}
.btn{position:relative;overflow:hidden}
.btn:not(.g){box-shadow:0 8px 18px color-mix(in srgb,var(--ac) 38%,transparent),inset 0 1px 0 #ffffff66,inset 0 -1px 0 #00000018}
.btn.dng{box-shadow:0 8px 18px #E5484D40,inset 0 1px 0 #ffffff55}
.btn:not(.g)::after{content:'';position:absolute;top:0;bottom:0;left:-60%;width:36%;background:linear-gradient(100deg,transparent,#ffffff59,transparent);transform:skewX(-20deg);animation:shine 5s ease-in-out infinite;pointer-events:none}
@keyframes shine{0%,55%{left:-60%}100%{left:140%}}
.chip.on{box-shadow:0 4px 12px color-mix(in srgb,var(--ac) 38%,transparent),inset 0 1px 0 #ffffff55}
.ll{color:#1B2033}
/* ===== theme + font pickers ===== */
.thg,.fcg{display:grid;gap:8px;margin:2px 3px 0}
.thg{grid-template-columns:repeat(3,1fr)}.fcg{grid-template-columns:1fr 1fr}
.th{border:2px solid var(--ln);border-radius:16px;padding:6px;background:var(--card);color:var(--tx);font:inherit;font-size:.78em;font-weight:700;cursor:pointer;display:flex;flex-direction:column;gap:6px;align-items:center;transition:transform .15s,border-color .2s,box-shadow .2s}
.th:active{transform:scale(.95)}

.pv{display:block;position:relative;width:100%;height:54px;border-radius:11px;overflow:hidden;background:linear-gradient(135deg,var(--p1),var(--p2));box-shadow:inset 0 0 0 1px #00000014}

.pv u{position:absolute;right:8px;top:8px;width:14px;height:14px;border-radius:50%;background:linear-gradient(135deg,var(--a1),var(--a2))}
.fc{border:2px solid var(--ln);border-radius:16px;padding:10px 12px;background:var(--card);color:var(--tx);text-align:start;cursor:pointer;transition:transform .15s,border-color .2s,box-shadow .2s;font-size:1em}
.fc:active{transform:scale(.97)}
.fc.on{border-color:var(--ac);box-shadow:0 0 0 3px color-mix(in srgb,var(--ac) 25%,transparent)}
.fc .fs{display:block;font-size:1.12em;font-weight:700;line-height:1.35}
.fc .fn{display:block;margin-top:2px;font-size:.72em;color:var(--mu)}
.th:focus-visible,.fc:focus-visible{outline:2px solid var(--ac);outline-offset:2px}
