let app,auth,db;try{app=initializeApp(firebaseConfig);auth=getAuth(app);db=getFirestore(app)}catch(e){window.fbErr=e.code||e.message;console.error(e)}
if(auth){
window.googleLoginFB=async()=>{if(firebaseConfig.apiKey.startsWith('YOUR')){notify('Firebase apiKey/appId not set in the file.');return}
if(!/^https?:$/.test(location.protocol)){notify('Google sign-in needs the app opened from a web address (https://...), not from a downloaded file. Host the file (GitHub Pages / Firebase Hosting) and open that link.');return}
const p=new GoogleAuthProvider();p.setCustomParameters({prompt:'select_account'});
try{await signInWithPopup(auth,p)}catch(e){if(['auth/popup-blocked','auth/operation-not-supported-in-this-environment'].includes(e.code))signInWithRedirect(auth,p).catch(x=>notify(x.code));else if(e.code!='auth/popup-closed-by-user'&&e.code!='auth/cancelled-popup-request')notify('Login error: '+e.code)}};
window.signOutFB=()=>signOut(auth).then(()=>{cloud.user=null;render()});
getRedirectResult(auth).catch(e=>console.error(e));
window.syncScore=async s=>{const u=auth.currentUser;if(!u)return;try{await setDoc(doc(db,"leaderboard",u.uid),{name:s.name,xp:s.xp,cor:s.cor,wr:s.wr,best:s.best,av:s.av&&s.av.img?{p:0}:s.av},{merge:true})}catch(e){console.error(e)}};
window.fetchBoard=async()=>{try{const snap=await getDocs(query(collection(db,"leaderboard"),orderBy("xp","desc"),limit(20)));const list=[];snap.forEach(d=>list.push({id:d.id,...d.data()}));
const u=auth.currentUser;let rank=0;if(u){const i=list.findIndex(p=>p.id==u.uid);if(i>=0)rank=i+1;else{const c=await getCountFromServer(query(collection(db,"leaderboard"),where("xp",">",S.xp)));rank=c.data().count+1}}return{list,rank}}catch(e){console.error(e);return null}};
onAuthStateChanged(auth,async u=>{cloud.user=u;if(u){try{const sn=await getDoc(doc(db,"leaderboard",u.uid));if(sn.exists()){const c=sn.data();S.name=(c.name&&c.name!='Player')?c.name:(u.displayName||S.name);S.xp=Math.max(S.xp,c.xp||0);S.cor=Math.max(S.cor,c.cor||0);S.wr=Math.max(S.wr,c.wr||0);S.best=Math.max(S.best,c.best||0)}else if(u.displayName&&S.name=='Player')S.name=u.displayName;if((!S.name||S.name=='Player')&&u.displayName)S.name=u.displayName;save();await syncScore(S)}catch(e){console.error(e)}}
if(!Q&&!busy)render()});}
</script></body></html>
